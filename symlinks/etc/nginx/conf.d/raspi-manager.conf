map $http_upgrade $grafana_connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 22223;
    server_name localhost;
    client_max_body_size 500m;

    location = / {
        return 302 /grafana/;
    }
    location = /grafana {
        return 301 /grafana/;
    }
    location /grafana/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $grafana_connection_upgrade;
        # Strip the public prefix; Grafana serves internal routes at /.
        proxy_pass http://127.0.0.1:30000/;
    }

    # Docker clients require /v2/ at the registry origin, not /docker/v2/.
    # /docker is a convenience entry point for checking the registry API.
    location = /docker {
        return 302 /v2/;
    }
    location = /docker/ {
        return 302 /v2/;
    }
    location /v2/ {
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 900s;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:5000;
    }
}
