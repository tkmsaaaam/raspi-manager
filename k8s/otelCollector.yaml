apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app: otel-collector
data:
  config.yaml: |
    receivers:
      filelog/container:
        include:
          - /var/log/containers/*.log
        operators:
          - type: container
      filelog/clamav:
        include:
          - /var/log/clamav/clamav.log
          - /var/log/clamav/daily-scan.log
          - /var/log/clamav/freshclam.log
    exporters:
      otlphttp/logs:
        endpoint: "http://victorialogs-svc.otel.svc.cluster.local:9428/insert/opentelemetry/"
    service:
      pipelines:
        logs:
          receivers: [filelog/container, filelog/clamav]
          exporters: [otlphttp/logs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          securityContext:
            runAsUser: 0
          image: docker.io/otel/opentelemetry-collector-contrib:0.158.0 # https://github.com/open-telemetry/opentelemetry-collector-contrib/releases https://hub.docker.com/r/otel/opentelemetry-collector-contrib
          args: ['--config', '/etc/config/config.yaml']
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: logs
              mountPath: /var/log
            - name: config
              mountPath: /etc/config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: config
          configMap:
            name: otel-collector
