apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/part-of: raspi-manager
    app: otel-collector
data:
  config.yaml: |
    receivers:
      filelog/container:
        include:
          - /var/log/containers/*.log
        operators:
          - type: container
      filelog/clamav:
        include:
          - /var/log/clamav/clamav.log
          - /var/log/clamav/daily-scan.log
          - /var/log/clamav/freshclam.log
        # Read existing scan results even when the file has not changed since startup.
        # Offsets are in memory, so collector restarts will re-read these files.
        start_at: beginning
        include_file_path: true
      filelog/auth:
        include:
          - /var/log/auth.log
        # Read existing authentication logs; restarts will re-read the file.
        start_at: beginning
        include_file_path: true
    exporters:
      otlphttp/logs:
        endpoint: "http://victorialogs-svc.otel.svc.cluster.local:9428/victorialogs/insert/opentelemetry/"
    service:
      telemetry:
        metrics:
          readers:
            - pull:
                exporter:
                  prometheus:
                    host: 0.0.0.0
                    port: 8888
      pipelines:
        logs:
          receivers: [filelog/container, filelog/clamav, filelog/auth]
          exporters: [otlphttp/logs]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  labels:
    app.kubernetes.io/part-of: raspi-manager
    app: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: otel-collector
          securityContext:
            # Host logs include root:root and clamav-owned files with mode 0640.
            runAsUser: 0
          ports:
            - name: metrics
              containerPort: 8888
              protocol: TCP
          image: docker.io/otel/opentelemetry-collector-contrib:0.158.0 # https://github.com/open-telemetry/opentelemetry-collector-contrib/releases https://hub.docker.com/r/otel/opentelemetry-collector-contrib
          args: ['--config', '/etc/config/config.yaml']
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - name: logs
              mountPath: /var/log
              readOnly: true
            - name: config
              mountPath: /etc/config
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: logs
          hostPath:
            path: /var/log
            type: Directory
        - name: config
          configMap:
            name: otel-collector
