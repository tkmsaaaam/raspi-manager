apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriatraces
  labels:
    app: victoriatraces
  namespace: otel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoriatraces
  template:
    metadata:
      labels:
        app: victoriatraces
    spec:
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: victoriatraces
          image: docker.io/victoriametrics/victoria-traces:v0.10.0 # https://github.com/VictoriaMetrics/victoriaTraces/releases https://hub.docker.com/r/victoriametrics/victoria-traces
          args:
            - -storageDataPath=/storage
            - -retentionPeriod=365d
            - -retention.maxDiskSpaceUsageBytes=1GB
          volumeMounts:
            - name: data
              mountPath: /storage
          ports:
            - containerPort: 10428
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriatraces-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: victoriatraces-svc
  labels:
    run: victoriatraces-svc
  namespace: otel
spec:
  ports:
    - port: 10428
      protocol: TCP
  selector:
    app: victoriatraces
---
# Capacity is declarative; hostPath does not enforce a disk usage limit.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: victoriatraces-pv
spec:
  capacity:
    storage: 2G
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    type: DirectoryOrCreate
    path: /var/lib/victoriatraces
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - raspberrypi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriatraces-pvc
  namespace: otel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: victoriatraces-pv
  resources:
    requests:
      storage: 2G
