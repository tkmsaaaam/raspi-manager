apiVersion: batch/v1
kind: CronJob
metadata:
  name: count-commits-js
  namespace: tasks
spec:
  schedule: '20 11 * * *'
  successfulJobsHistoryLimit: 0
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          containers:
            - name: count-commits-js
              image: localhost:5000/count-commits-js:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "$PRIVATE_KEY" > /private-key.pem
                  export GH_TOKEN=`/app/jwt`
                  /app/count-commits-js
              env:
                - name: INSTALL_ID
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: INSTALL_ID
                - name: APP_ID
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: APP_ID
                - name: PRIVATE_KEY
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: PRIVATE_KEY
                - name: GH_USER_NAME
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: GH_USER_NAME
                - name: SLACK_BOT_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: SLACK_BOT_TOKEN
                - name: SLACK_CHANNEL_ID
                  valueFrom:
                    secretKeyRef:
                      name: common-secrets
                      key: SLACK_CHANNEL_ID
                - name: OTEL_EXPORTER_OTLP_METRICS_ENDPOINT
                  value: http://pushgateway-svc.otel.svc.cluster.local:9091
                - name: OTEL_EXPORTER_OTLP_LOGS_ENDPOINT
                  value: http://loki-svc.otel.svc.cluster.local:3100/otlp/v1/logs
          restartPolicy: Never
