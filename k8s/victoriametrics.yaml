apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoriametrics
  namespace: otel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoriametrics-scrape
rules:
  - apiGroups: ['']
    resources: ['nodes']
    verbs: ['get', 'list', 'watch']
  - apiGroups: ['']
    resources: ['nodes/proxy']
    verbs: ['get']
  - apiGroups: ['']
    resources: ['pods']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoriametrics-scrape
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: victoriametrics-scrape
subjects:
  - kind: ServiceAccount
    name: victoriametrics
    namespace: otel
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: victoriametrics-scrape
  namespace: otel
data:
  prometheus.yaml: |
    global:
      scrape_interval: 30s
      scrape_timeout: 10s
    scrape_configs:
      - job_name: grafana
        metrics_path: /metrics
        static_configs:
          - targets: ['grafana-svc.otel.svc.cluster.local:3000']
      - job_name: victoriametrics
        metrics_path: /victoriametrics/metrics
        static_configs:
          - targets: ['127.0.0.1:8428']
      - job_name: victorialogs
        metrics_path: /victorialogs/metrics
        static_configs:
          - targets: ['victorialogs-svc.otel.svc.cluster.local:9428']
      - job_name: victoriatraces
        metrics_path: /victoriatraces/metrics
        static_configs:
          - targets: ['victoriatraces-svc.otel.svc.cluster.local:10428']
      - job_name: otel-collector
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [default]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            regex: 'otel-collector|k8s-(stats|cluster|events|objects)-receiver'
            action: keep
          - source_labels: [__meta_kubernetes_pod_phase]
            regex: Running
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_name]
            regex: metrics
            action: keep
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: '8888'
            action: keep
          - source_labels: [__meta_kubernetes_namespace]
            target_label: namespace
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_app]
            target_label: collector
          - source_labels: [__meta_kubernetes_pod_node_name]
            target_label: node
      - job_name: node
        static_configs:
          - targets:
              - node-exporter-svc.otel.svc.cluster.local:9100
      # Kubernetes 1.37 with PodAndContainerStatsFromCRI=true serves CRI
      # pod/container metrics at /metrics/cadvisor (CRI-O >= 1.36.3 adds
      # namespace, pod and container labels). Node metrics still use cAdvisor.
      # https://kubernetes.io/docs/reference/instrumentation/cri-pod-container-metrics/
      - job_name: kubelet-cri
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
      - job_name: kubelet
        scheme: https
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        tls_config:
          ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        kubernetes_sd_configs:
          - role: node
        relabel_configs:
          - target_label: __address__
            replacement: kubernetes.default.svc:443
          - source_labels: [__meta_kubernetes_node_name]
            target_label: __metrics_path__
            replacement: /api/v1/nodes/$1/proxy/metrics
          - source_labels: [__meta_kubernetes_node_name]
            target_label: instance
          - source_labels: [__meta_kubernetes_node_name]
            target_label: node
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoriametrics
  labels:
    app: victoriametrics
  namespace: otel
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: victoriametrics
  template:
    metadata:
      labels:
        app: victoriametrics
    spec:
      serviceAccountName: victoriametrics
      tolerations:
        - key: node-role.kubernetes.io/master
          effect: NoSchedule
      containers:
        - name: victoriametrics
          image: docker.io/victoriametrics/victoria-metrics:v1.148.0 # https://github.com/VictoriaMetrics/victoriaMetrics/releases https://hub.docker.com/r/victoriametrics/victoria-metrics
          args:
            - -http.pathPrefix=/victoriametrics
            - -storageDataPath=/storage
            # VM has no disk-size retention limit; tune this after measuring usage.
            - -retentionPeriod=365d
            - -promscrape.config=/etc/victoriametrics/prometheus.yaml
          volumeMounts:
            - name: data
              mountPath: /storage
            - name: scrape-config
              mountPath: /etc/victoriametrics
              readOnly: true
          ports:
            - containerPort: 8428
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 1536Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: victoriametrics-pvc
        - name: scrape-config
          configMap:
            name: victoriametrics-scrape
---
apiVersion: v1
kind: Service
metadata:
  name: victoriametrics-svc
  labels:
    run: victoriametrics-svc
  namespace: otel
spec:
  type: NodePort
  ports:
    - port: 8428
      targetPort: 8428
      nodePort: 30001
      protocol: TCP
  selector:
    app: victoriametrics
---
# Capacity is declarative; hostPath does not enforce a disk usage limit.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: victoriametrics-pv
spec:
  capacity:
    storage: 2G
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    type: DirectoryOrCreate
    path: /var/lib/victoriametrics
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - raspberrypi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: victoriametrics-pvc
  namespace: otel
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: ""
  volumeName: victoriametrics-pv
  resources:
    requests:
      storage: 2G
