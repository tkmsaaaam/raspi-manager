# https://github.com/open-telemetry/opentelemetry-collector-contrib/blob/v0.157.0/receiver/k8seventsreceiver/README.md
apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-events-receiver
  labels:
    app: k8s-events-receiver
data:
  config.yaml: |
    receivers:
      k8s_events:
        namespaces: [default, otel, tasks]
    exporters:
      otlphttp:
        endpoint: "http://victorialogs-svc.otel.svc.cluster.local:9428/insert/opentelemetry/"
    service:
      pipelines:
        logs:
          receivers: [k8s_events]
          exporters: [otlphttp]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: k8s-events-receiver
  name: k8s-events-receiver
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-events-receiver
  labels:
    app: k8s-events-receiver
rules:
  - apiGroups:
      - ''
    resources:
      - events
      - namespaces
      - namespaces/status
      - nodes
      - nodes/spec
      - pods
      - pods/status
      - replicationcontrollers
      - replicationcontrollers/status
      - resourcequotas
      - services
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - apps
    resources:
      - daemonsets
      - deployments
      - replicasets
      - statefulsets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - extensions
    resources:
      - daemonsets
      - deployments
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - batch
    resources:
      - jobs
      - cronjobs
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - autoscaling
    resources:
      - horizontalpodautoscalers
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-events-receiver
  labels:
    app: k8s-events-receiver
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: k8s-events-receiver
subjects:
  - kind: ServiceAccount
    name: k8s-events-receiver
    namespace: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-events-receiver
  labels:
    app: k8s-events-receiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-events-receiver
  template:
    metadata:
      labels:
        app: k8s-events-receiver
    spec:
      serviceAccountName: k8s-events-receiver
      containers:
        - name: k8s-events-receiver
          image: docker.io/otel/opentelemetry-collector-contrib:0.157.0 # https://github.com/open-telemetry/opentelemetry-collector-contrib/releases https://hub.docker.com/r/otel/opentelemetry-collector-contrib
          args: ['--config', '/etc/config/config.yaml']
          volumeMounts:
            - name: config
              mountPath: /etc/config
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: k8s-events-receiver
